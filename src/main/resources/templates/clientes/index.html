<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{base :: layout(~{:: #titulo-pagina}, ~{:: #contenido})}">

<head>
  <meta charset="UTF-8">
  <title>Fit Nation</title>
</head>

<body>
  <th:block id="titulo-pagina" th:fragment="titulo-pagina">Listado de Clientes</th:block>
  <div id="contenido" th:fragment="contenido">

<div class="container">
    <div class="text-end mb-4">
        <th:block th:if="${(#authentication.principal.rol == 'admin' or #authentication.principal.rol == 'entrenador' or #authentication.principal.rol == 'recepcionista')}">
        <a th:href="@{/clientes/add}" class="btn btn-primary"><i
                class="bi bi-person-plus-fill me-1"></i> Agregar Cliente</a>
        </th:block>
    </div>

    <div class="card p-3 shadow-sm border-0">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>Teléfono</th>
                    <th:block th:if="${(#authentication.principal.rol == 'admin' or #authentication.principal.rol == 'entrenador' or #authentication.principal.rol == 'recepcionista')}">
                    <th>Acciones</th>
                    </th:block>
                </tr>
            </thead>
            <tbody>
                <th:block th:each="cliente : ${clientes}">
                <tr>
                    <td th:text="${cliente.idCliente}"></td>
                    <td class="fw-bold" th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.edad}"></td>
                    <td th:text="${cliente.telefono}"></td>
                    <th:block th:if="${(#authentication.principal.rol == 'admin' or #authentication.principal.rol == 'entrenador' or #authentication.principal.rol == 'recepcionista')}">
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/clientes/edit/{id}(id=${cliente.idCliente})}"
                                class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/clientes/delete/{id}(id=${cliente.idCliente})}" method="post"
                                class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('¿Eliminar este cliente?');"><i
                                        class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </td>
                    </th:block>
                </tr>
                </th:block><th:block th:if="${#lists.isEmpty(clientes)}">
                <tr>
                    <td colspan="5" class="text-center text-muted">No hay clientes registrados.</td>
                </tr>
                </th:block>
            </tbody>
        </table>
    </div>
</div>

  </div>
</body>

</html>
