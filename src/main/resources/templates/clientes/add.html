<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{form-base :: formLayout(~{:: #titulo-pagina}, ~{:: #contenido})}">

<head>
  <meta charset="UTF-8">
  <title>Fit Nation</title>
</head>

<body>
  <th:block id="titulo-pagina" th:fragment="titulo-pagina">Agregar Cliente</th:block>
  <div id="contenido" th:fragment="contenido">

<form th:action="@{/clientes/add}" method="POST"
    <div class="form-group mb-3">
        <label class="form-label">Nombre Completo</label>
        <th:block th:if="${#authentication.principal.rol == 'usuario'}">
            <input type="text" class="form-control bg-light" th:value="${#authentication.principal.nombre}" readonly>
        </th:block><th:block th:else>
            <input type="text" name="nombre" class="form-control" required placeholder="Ej. Carlos Torres">
        </th:block>
    </div>
    <div class="form-group mb-3">
        <label class="form-label">Edad</label>
        <input type="number" name="edad" class="form-control" required placeholder="Ej. 25">
    </div>
    <div class="form-group mb-4">
        <label class="form-label">Teléfono</label>
        <input type="text" name="telefono" class="form-control" placeholder="Ej. 555-0100">
    </div>
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Guardar Cliente</button>
        <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

  </div>
</body>

</html>
