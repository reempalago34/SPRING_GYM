<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{form-base :: formLayout(~{:: #titulo-pagina}, ~{:: #contenido})}">

<head>
  <meta charset="UTF-8">
  <title>Fit Nation</title>
</head>

<body>
  <th:block id="titulo-pagina" th:fragment="titulo-pagina">Editar Plan</th:block>
  <div id="contenido" th:fragment="contenido">

<form th:action="@{/planes/edit/{id}(id=${id})}" method="POST"
    <div class="form-group mb-3">
        <label class="form-label">Nombre del Plan</label>
        <input type="text" name="nombrePlan" class="form-control" th:value="${plan.nombrePlan}" required>
    </div>
    <div class="form-group mb-3">
        <label class="form-label">Precio</label>
        <input type="number" step="0.01" name="precio" class="form-control" th:value="${plan.precio}" required>
    </div>
    <div class="form-group mb-4">
        <label class="form-label">Duración en Meses</label>
        <input type="number" name="duracionMeses" class="form-control" th:value="${plan.duracionMeses}" required>
    </div>
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Actualizar Plan</button>
        <a th:href="@{/planes}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

  </div>
</body>

</html>
