# =====================================================================
# Fit Nation - Spring Boot (réplica del proyecto Flask gym.proyecto.sbs)
# =====================================================================

server.port=8080

# ---------------------------------------------------------------------
# BASE DE DATOS
# ---------------------------------------------------------------------
# Credenciales locales: el usuario 'erick' no tiene CREATEDB, asi que el
# proyecto vive en un ESQUEMA DEDICADO dentro de la base 'tempsensor'.
# Asi no se toca ninguna tabla del curso (device, reading, location...).
#   - TCP con password 'fitnation' (lo que usa JDBC)
#   - El socket peer-auth que usa el curso sigue intacto
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/tempsensor
spring.datasource.username=erick
spring.datasource.password=fitnation
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------
# FLYWAY - solo el esquema 'fitnation'
# ---------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.schemas=fitnation
spring.flyway.default-schema=fitnation
spring.flyway.table=flyway_schema_history
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------
# JPA / HIBERNATE - solo valida, las tablas las crea Flyway
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=fitnation
# Spring Boot por defecto traduce camelCase -> snake_case (idUser -> id_user).
# El esquema de Flask conserva "idUser" / "passwordUser" entre comillas, así que
# se usa una estrategia propia que entrecomilla los nombres con mayúsculas
# (misma regla que aplica SQLAlchemy). Ver MixedCasePhysicalNamingStrategy.
spring.jpa.properties.hibernate.physical_naming_strategy=co.sena.adso.fitnation.config.MixedCasePhysicalNamingStrategy

# ---------------------------------------------------------------------
# THYMELEAF
# ---------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.suffix=.html

# ---------------------------------------------------------------------
# OPENAPI / SWAGGER UI - documentacion interactiva de la API REST en /docs
# ---------------------------------------------------------------------
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ---------------------------------------------------------------------
# SEGURIDAD (sesion de formulario, igual que Flask-Login)
# ---------------------------------------------------------------------
# Password por defecto de la semilla de administrador.
fitnation.admin.nombre=Admin
fitnation.admin.email=admin@example.com
fitnation.admin.password=admin123

spring.jpa.defer-datasource-initialization=false
