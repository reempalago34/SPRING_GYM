<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{form-base :: formLayout(~{:: #titulo-pagina}, ~{:: #contenido})}">

<head>
  <meta charset="UTF-8">
  <title>Fit Nation</title>
</head>

<body>
  <th:block id="titulo-pagina" th:fragment="titulo-pagina">Editar Usuario <th:block th:text="${user.nameUser}"></th:block></th:block>
  <div id="contenido" th:fragment="contenido">

<form th:action="@{/User/edit/{id}(id=${user.idUser})}" method="post" class="needs-validation" novalidate>
    <div class="form-group mb-3">
        <label for="nameUser" class="form-label"><i class="bi bi-person me-1"></i>Nombre de Usuario:</label>
        <input type="text" id="nameUser" name="nameUser" th:value="${user.nameUser}" required class="form-control">
    </div>

    <div class="form-group mb-3">
        <label for="telefonoUser" class="form-label"><i class="bi bi-telephone me-1"></i>Teléfono:</label>
        <input type="text" id="telefonoUser" name="telefonoUser" th:value="${(user.telefono ?: '')}" class="form-control">
    </div>

    <div class="form-group mb-3">
        <label for="emailUser" class="form-label"><i class="bi bi-envelope me-1"></i>Email:</label>
        <input type="email" id="emailUser" name="emailUser" th:value="${user.emailUser}" required class="form-control">
    </div>
   
    <div class="form-group mb-3">
        <label for="passwordUser" class="form-label"><i class="bi bi-lock me-1"></i>Contraseña:</label>
        <div class="input-group">
            <input type="password" id="passwordUser" name="passwordUser" class="form-control" placeholder="Mínimo 6 caracteres">
            <button class="btn toggle-password" type="button" data-target="passwordUser">
                <i class="bi bi-eye"></i>
            </button>
        </div>
        <small class="text-muted">Déjalo vacío si no deseas cambiar la contraseña</small>
    </div>

    <div class="form-group mb-4">
        <label for="confirmPassword" class="form-label"><i class="bi bi-lock-fill me-1"></i>Confirmar Contraseña:</label>
        <div class="input-group">
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repite tu contraseña">
            <button class="btn toggle-password" type="button" data-target="confirmPassword">
                <i class="bi bi-eye"></i>
            </button>
        </div>
    </div>

    <th:block th:if="${#authentication.principal.rol == 'admin'}">
    <div class="form-group mb-4">
        <label for="rol" class="form-label fw-bold"><i class="bi bi-shield-lock me-1"></i>Rol del Sistema:</label>
        <select name="rol" id="rol" class="form-select border-0 px-3 py-2 bg-light">
            <option value="usuario" th:selected="${user.rol == 'usuario'}">Usuario</option>

            <option value="entrenador" th:selected="${user.rol == 'entrenador'}">Entrenador</option>
            <option value="recepcionista" th:selected="${user.rol == 'recepcionista'}">Recepcionista</option>
            <option value="admin" th:selected="${user.rol == 'admin'}">Administrador</option>
        </select>
    </div>
    </th:block>
    
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check-circle me-1"></i>Actualizar Usuario</button>
        <a th:href="@{/User}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

<script>
    // Validación de formulario basica
    (function() {
        'use strict';
        window.addEventListener('load', function() {
            var forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    var pass = document.getElementById('passwordUser').value;
                    var confirmPass = document.getElementById('confirmPassword').value;

                    if (pass !== confirmPass) {
                        event.preventDefault();
                        event.stopPropagation();
                        alert('Las contraseñas no coinciden.');
                        return;
                    }

                    if (form.checkValidity() === false) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();
</script>

  </div>
</body>

</html>
